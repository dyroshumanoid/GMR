# Robot body group definitions and self-collision limit parameters
parameters:
  damping: 10
  max_iter: 10
  velocity_limit : 5
  collision_avoidance_weight : 0.05

groups:
  torso: ["Waist", "Chest"]  
  l_leg: ["Left_Hip", "Left_Shin", "Left_Outer_Foot", "Left_Inner_Foot"]
  r_leg: ["Right_Hip", "Right_Shin", "Right_Outer_Foot", "Right_Inner_Foot"]
  ground: ["floor"]



collision_limits:

  - name: "body_general"
    pairs: 
      - ["l_leg", "r_leg"]
      - ["l_leg", "torso"]
      - ["r_leg", "torso"]
    margin: 0.01
    detect_dist: 0.05
  
  - name: "ground_collision"
    pairs:
      - ["torso", "ground"]
      - ["l_leg", "ground"]
      - ["r_leg", "ground"]
    margin: 0.01
    detect_dist: 0.05

foot_geoms:
  left:
    - Left_Inner_Foot
    - Left_Outer_Foot
  right:
    - Right_Inner_Foot
    - Right_Outer_Foot

foot_contact:
  enabled: false
  threshold: 0.3   # m/s (1 cm/s) — contact activates when human foot speed <= this
  velocity_bound: 0.001 # m/s  — hard XY velocity limit once in contact

  contact_points:
    - body_name: "left_ankle_roll_link"
      local_pos: [0.03, 0.0, -0.193]

    - body_name: "right_ankle_roll_link"
      local_pos: [0.03, 0.0, -0.193]