# Robot body group definitions and self-collision limit parameters
parameters:
  damping: 0.5
  max_iter: 10
  velocity_limit : 10
  collision_avoidance_weight : 0.4
  collision_ramp_frames: 60

groups:
  head: ["Head"]
  torso: ["Left_Pelvis", "Right_Pelvis", "Upper_Left_Chest", "Upper_Right_Chest"]  
  l_foot: ["Left_Inner_Foot", "Left_Outer_Foot"]
  r_foot: ["Right_Inner_Foot", "Right_Outer_Foot"]
  l_upper_leg_foot: ["Left_Upper_Leg", "Left_Lower_Leg"]
  r_upper_leg_foot:  ["Right_Upper_Leg", "Right_Lower_Leg"]

  l_hand_arm: ["Left_ForeArm", "Left_Hand"]
  r_hand_arm: ["Right_ForeArm", "Right_Hand"]
  l_lower_leg_foot: ["Left_Lower_Leg", "Left_Inner_Foot", "Left_Outer_Foot"]
  r_lower_leg_foot: ["Right_Lower_Leg", "Right_Inner_Foot", "Right_Outer_Foot"]

  l_arm: ["Left_Upper_Arm", "Left_ForeArm", "Left_Hand"]
  r_arm: ["Right_Upper_Arm", "Right_ForeArm", "Right_Hand"]
  l_leg: ["Left_Upper_Leg", "Left_Lower_Leg", "Left_Outer_Foot"]
  r_leg: ["Right_Upper_Leg", "Right_Lower_Leg", "Right_Outer_Foot"]
  ground: ["floor"]



collision_limits:

  - name: "body_general"
    pairs: 
      - ["l_foot", "r_foot"]
      - ["l_arm", "r_arm"]
      - ["l_arm", "l_leg"]
      - ["l_arm", "r_leg"]
      - ["r_arm", "l_leg"]
      - ["r_arm", "r_leg"]
      - ["head", "l_arm"]
      - ["head", "r_arm"]
      - ["l_hand_arm", "torso"]
      - ["r_hand_arm", "torso"]
      - ["l_lower_leg_foot", "torso"]
      - ["r_lower_leg_foot", "torso"]
    margin: 0.01
    detect_dist: 0.05
  
  - name: "ground_collision"
    pairs:
      - ["l_arm", "ground"]
      - ["r_arm", "ground"]
      - ["head", "ground"]
    margin: 0.01
    detect_dist: 0.05
foot_geoms:
  left:
    - Left_Foot
    - Left_Inner_Foot
    - Left_Outer_Foot
  right:
    - Right_Foot
    - Right_Inner_Foot
    - Right_Outer_Foot
foot_contact:
  enabled: true
  threshold: 0.3   # m/s (1 cm/s) — contact activates when human foot speed <= this
  velocity_bound: 0.001 # m/s  — hard XY velocity limit once in contact

  contact_points:
    - body_name: "left_ankle_roll_link"
      local_pos: [0.03, 0.0, -0.193]

    - body_name: "right_ankle_roll_link"
      local_pos: [0.03, 0.0, -0.193]